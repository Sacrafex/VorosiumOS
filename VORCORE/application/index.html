<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self'"
    />
  <link rel="stylesheet" type="text/css" href="./styles.css" />
    <title>Vorcore - Library</title>
  </head>
  <body>
  <div class="app">
  <nav class="sidebar">
      <header>
        <div class="image-text">
          <span class="image">
            <img src="logo.png" alt="" />
          </span>

          <div class="text logo-text">
            <span class="title">Vorcore</span>
            <span class="secondary">Library</span>
          </div>
        </div>

        <i class="toggle"></i>
      </header>

      <div class="menu-bar">
        <div class="menu">
          <li class="search-box">
            <i class="icon"></i>
            <input type="text" placeholder="Search..." />
          </li>

          <ul class="menu-links">
            <li>
              <a href="#">
                <i class="icon"></i>
                <span class="text">Dashboard</span>
              </a>
            </li>

            <li>
              <a href="#">
                <i class="icon"></i>
                <span class="text">Updates</span>
              </a>
            </li>

            <li>
              <a href="#">
                <i class="icon"></i>
                <span class="text">Applications</span>
              </a>
            </li>

            <li>
              <a href="#">
                <i class="icon"></i>
                <span class="text">Plugins</span>
              </a>
            </li>

            <li>
              <a href="#">
                <i class="icon"></i>
                <span class="text">Drivers</span>
              </a>
            </li>
          </ul>
        </div>

        <div class="bottom-content">
          <li class="mode">
            <div class="">
              <i class="icon"></i>
              <i class="icon"></i>
            </div>
            <span class="mode-text text">Dark mode</span>

            <div class="toggle-switch">
              <span class="switch"></span>
            </div>
          </li>
        </div>
      </div>
    </nav>
    <main class="content">
      <div class="header">

        <div id="Loading">
          <center><div class="loader"></div></center>
        </div>

        <div id="Dashboard">
          <h2>Dashboard</h2>
        </div>

        <div id="Updates">
          <h2>Updates</h2>
        </div>

        <div id="Applications">
          <h2>Applications</h2>
        </div>

        <div id="Plugins">
          <h2>Plugins</h2>
        </div>

        <div id="Drivers">
          <h2>Drivers</h2>
        </div>

        <div id="PluginEditor">
          <h2>Plugin Editor</h2>
        </div>

        <div id="Settings">
          <h2>Settings</h2>
        </div>

      </div>
    </main>
  </div>
  </body>
</html>
